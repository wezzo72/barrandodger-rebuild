name: Seal reach reading

on:
  schedule:
    # 16:15 UTC is 03:15 Australian Eastern Daylight Time.
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append today's reading
        run: python3 scripts/seal-reach.py
      - name: Commit the reading
        run: |
          git config user.name "reach-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reach-ledger.json
          if git diff --cached --quiet; then
            echo "No new reading."
            exit 0
          fi
          git commit -m "Seal the day's reach reading."
          git push
